<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse — Portal Access</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 420px;">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">⚡ CivicPulse</h2>
        <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
            Citizen Grievance & Escalation System
        </p>

        <div class="tabs" style="margin-bottom: 1.5rem;">
            <button class="tab-btn active" id="tab-login" onclick="switchAuthMode('login')">Sign In</button>
            <button class="tab-btn" id="tab-signup" onclick="switchAuthMode('signup')">Register</button>
        </div>

        <form id="login-form" onsubmit="handleAuth(event, '/api/login')">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" required placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Access Terminal</button>
        </form>

        <form id="signup-form" class="hidden" onsubmit="handleAuth(event, '/api/signup')">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" required placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signup-email" required placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>Occupation</label>
                <input type="text" id="signup-occupation" required placeholder="Civil Engineer / Resident">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Create Account</button>
        </form>

        <div id="auth-error" style="color: var(--danger); font-size: 0.85rem; margin-top: 1rem; text-align: center;"></div>
        
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
            <a href="/admin" style="color: var(--text-muted); text-decoration: none;">🔑 Government Official Login</a>
        </div>
    </div>

    <script>
        function switchAuthMode(mode) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            document.getElementById('auth-error').innerText = '';

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        async function handleAuth(e, endpoint) {
            e.preventDefault();
            const errDiv = document.getElementById('auth-error');
            errDiv.innerText = '';

            let payload = {};
            if (endpoint === '/api/login') {
                payload = {
                    email: document.getElementById('login-email').value.trim(),
                    password: document.getElementById('login-password').value
                };
            } else {
                payload = {
                    name: document.getElementById('signup-name').value.trim(),
                    email: document.getElementById('signup-email').value.trim(),
                    occupation: document.getElementById('signup-occupation').value.trim(),
                    password: document.getElementById('signup-password').value
                };
            }

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errDiv.innerText = data.message || 'Authentication failed.';
                }
            } catch (err) {
                errDiv.innerText = 'Server error. Please try again.';
            }
        }
    </script>
</body>
</html>
